<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vibrant Blue Gradients inspired by Parexa & Bank BRI -->
    <linearGradient id="santaraGradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D62"/>
      <stop offset="100%" stop-color="#001633"/>
    </linearGradient>
    <linearGradient id="santaraGradRoyal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00529C"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    <linearGradient id="santaraGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00529C"/>
    </linearGradient>
    <linearGradient id="santaraGradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#002D62" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Group with Soft Elevation Shadow -->
  <g filter="url(#softGlow)">
    
    <!-- Top Arc: Upward Flowing Agricultural Leaf & Demand Stream (Electric Cyan to Royal Blue) -->
    <!-- Inspired by Parexa & Flexy dynamic geometry -->
    <path d="M 28 38 
             C 28 22, 42 14, 62 14 
             C 84 14, 96 26, 96 44 
             C 96 58, 86 67, 72 70 
             C 60 72, 48 66, 44 56 
             C 42 51, 46 45, 52 45 
             C 57 45, 61 48, 63 53 
             C 66 59, 74 61, 80 57 
             C 85 53, 86 46, 84 40 
             C 81 29, 72 23, 60 23 
             C 46 23, 38 29, 38 38 
             C 38 42, 34 46, 29 45 
             C 28.3 44, 28 41, 28 38 Z" 
          fill="url(#santaraGradCyan)" />

    <!-- Bottom Arc: Sturdy Protective Escrow Cradle & Supply Chain Loop (Deep Bank BRI Navy) -->
    <!-- Inspired by Project Spiro & Bipal continuous loop -->
    <path d="M 92 82 
             C 92 98, 78 106, 58 106 
             C 36 106, 24 94, 24 76 
             C 24 62, 34 53, 48 50 
             C 60 48, 72 54, 76 64 
             C 78 69, 74 75, 68 75 
             C 63 75, 59 72, 57 67 
             C 54 61, 46 59, 40 63 
             C 35 67, 34 74, 36 80 
             C 39 91, 48 97, 60 97 
             C 74 97, 82 91, 82 82 
             C 82 78, 86 74, 91 75 
             C 91.7 76, 92 79, 92 82 Z" 
          fill="url(#santaraGradNavy)" />

    <!-- Center Escrow Core Node (Bank BRI Trust Token / Dynamic Interlocking Pulse) -->
    <!-- Combining Project Spiro's protective sphere & Bipal's inner focal point -->
    <circle cx="60" cy="60" r="11" fill="url(#santaraGradRoyal)" />
    <circle cx="60" cy="60" r="5.5" fill="#FFFFFF" />
    <circle cx="62" cy="58" r="2.2" fill="#38BDF8" />
  </g>
</svg>
