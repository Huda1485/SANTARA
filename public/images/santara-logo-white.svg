             C 32 102, 20 90, 20 72 
             C 20 58, 30 49, 44 46 
             C 56 44, 68 50, 72 60 
             C 74 65, 70 71, 64 71 
             C 59 71, 55 68, 53 63 
             C 50 57, 42 55, 36 59 
