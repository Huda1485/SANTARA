    <circle cx="152" cy="41" r="4.5" fill="#38BDF8" />

    <text x="1" y="65" 
          font-family="system-ui, -apple-system, 'SF Pro Text', 'Google Sans', sans-serif" 
          font-size="9.5" 
          font-weight="700" 
          letter-spacing="0.16em" 
